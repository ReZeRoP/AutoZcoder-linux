name: Linux tests

on:
  push:
    branches: [main, master, linux-port]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux test dependencies
        run: python -m pip install -r requirements-linux.txt -r requirements-dev.txt
      - name: Run offline regression suite
        run: python -m pytest tests -q -rs
      - name: Compile application and check launchers
        run: |
          python -m compileall -q zcode_gateway generator
          bash -n packaging/fedora/bootstrap.sh packaging/fedora/build-rpm.sh
          python -m py_compile packaging/fedora/autozcoder
