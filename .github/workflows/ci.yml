name: Linux tests

on:
  push:
    branches: [main, master, linux-port, 'feature/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-sidecar:
    # Source-only tooling is retained, so its offline regressions remain a gate.
    # This does not compile, package, or run the minter against a service.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Test retained sidecar source with locked dependencies
        working-directory: tools/captcha-mint
        run: |
          bun install --frozen-lockfile
          bun run test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux test dependencies
        run: python -m pip install -r requirements-linux.txt -r requirements-dev.txt ruff playwright Pillow PySocks
      - name: Install fixture browser
        run: python -m playwright install --with-deps chromium
      - name: Runtime-error lint
        run: python -m ruff check --select E9,F63,F7,F82,F811 zcode_gateway generator gui_main.py
      - name: Run offline regression suite
        run: python -m pytest tests -q -rs --junitxml=/tmp/autozcoder-pytest.xml
      - name: Require offline browser coverage without skips
        if: always()
        run: python scripts/check_browser_coverage.py /tmp/autozcoder-pytest.xml
      - name: Compile application and check launchers
        run: |
          python -m compileall -q zcode_gateway generator
          bash -n packaging/fedora/bootstrap.sh packaging/fedora/build-rpm.sh scripts/build/linux.sh install-linux.sh
          python -m py_compile packaging/fedora/autozcoder
          node --test tests/test_*.cjs

  packaging:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Fedora verification tools
        run: dnf install -y git python3 rpm-build systemd systemd-rpm-macros desktop-file-utils nodejs
      - uses: actions/checkout@v4
      - name: Trust the exact checkout inside the Fedora container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify inert user service and packaging
        run: |
          python3 packaging/fedora/test-packaging.py
          desktop-file-validate packaging/fedora/autozcoder.desktop
          rpmspec -q --srpm packaging/fedora/autozcoder.spec
          # Container-only executable fixture for systemd's ExecStart validation.
          install -m 755 packaging/fedora/autozcoder /usr/bin/autozcoder
          mkdir -p /tmp/autozcoder-unit-verify
          chmod 700 /tmp/autozcoder-unit-verify
          XDG_RUNTIME_DIR=/tmp/autozcoder-unit-verify systemd-analyze --user verify packaging/fedora/autozcoder.service
